<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#4A2E18">
<title>{% block title %}Alberich{% endblock %}</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png?v=2">
<link rel="stylesheet" href="/static/app.css?v=52">
<link rel="stylesheet" href="/static/frames.css?v=23">
</head>
<body>
{% if not bare %}
<header class="top"><a class="brand" href="/">Alberich</a>
  <nav class="topnav" aria-label="Main">{% for label, href, ic in nav %}<a href="{{ href }}"{% if path == href or (href != '/' and path.startswith(href)) %} aria-current="page"{% endif %}>{{ pxicon(ic, 22) }}<span>{{ label }}</span></a>{% endfor %}</nav></header>
{% endif %}
<main class="wrap">{% block body %}{% endblock %}</main>
{% if not bare %}
<nav class="tabbar" aria-label="Main">{% for label, href, ic in nav %}<a href="{{ href }}"{% if path == href or (href != '/' and path.startswith(href)) %} aria-current="page"{% endif %}>{{ pxicon(ic, 22) }}<span>{{ label }}</span></a>{% endfor %}</nav>
{% endif %}
<div id="loadbar" aria-hidden="true"></div>
<div id="working" hidden role="status" aria-live="polite"><div class="card aged"><p><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span id="workmsg"></span></p></div></div>
<ul class="toasts" id="toasts" aria-live="polite"></ul>
<script src="/static/outbox.js" defer></script>
<script src="/static/app.js" defer></script>
<script src="/static/busy.js" defer></script>
</body>
</html>
